<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Your Meal - CraveCart</title>
    <link rel="stylesheet" href="styles.css"> 
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="order.html">Order Now</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <section class="menu">
        <h2>Choose Your Dishes</h2>

    
        <div class="dish">
            <h3>Burger</h3>
            <p>Price: Rs.100</p>
            <label for="quantity1">Quantity:</label>
            <input type="number" id="quantity1" name="quantity1" value="0" min="0" onchange="updateTotal()">
        </div>

        <div class="dish">
            <h3>Biriyani</h3>
            <p>Price: Rs.190</p>
            <label for="quantity2">Quantity:</label>
            <input type="number" id="quantity2" name="quantity2" value="0" min="0" onchange="updateTotal()">
        </div>

       
        <div class="dish">
            <h3>Masala Dosa</h3>
            <p>Price: Rs.90</p>
            <label for="quantity3">Quantity:</label>
            <input type="number" id="quantity3" name="quantity3" value="0" min="0" onchange="updateTotal()">
        </div>

     
        <div class="total">
            <h3>Total: Rs.<span id="totalAmount">0</span></h3>
        </div>

        
        <button onclick="window.location.href='thank-you.html'">Proceed to Checkout</button>

    </section>


    <script src="script.js"></script> 
</body>
</html>
